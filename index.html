<!DOCTYPE html>
<html lang="en">
<head>
  <base href="/Apna-Batwa/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Apna Batwa - Offline-first smart personal finance, expense tracking & khata ledger app.">
  <meta name="theme-color" content="#002D62">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Apna Batwa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Apna Batwa - Smart Finance & Khata</title>
  <link rel="manifest" href="manifest.json">

  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0A1128;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      user-select: none;
    }
    #loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      transition: opacity 0.4s ease-out;
    }
    .app-logo {
      width: 88px;
      height: 88px;
      border-radius: 22px;
      box-shadow: 0 10px 30px rgba(0, 45, 98, 0.5);
      animation: pulse 2s infinite ease-in-out;
    }
    .app-title {
      color: #FFFFFF;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin: 0;
    }
    .app-subtitle {
      color: #8E9AAF;
      font-size: 13px;
      margin: 0;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #0077FE;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-top: 6px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <img src="icons/Icon-192.png" alt="Apna Batwa" class="app-logo">
    <h1 class="app-title">Apna Batwa</h1>
    <p class="app-subtitle">Smart Personal Finance & Khata</p>
    <div class="spinner"></div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      const loader = document.getElementById('loading-container');
      if (loader) {
        loader.style.opacity = '0';
        setTimeout(function() {
          loader.remove();
        }, 400);
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>

name: apnabatwa
description: "Apna Batwa - Offline-first personal finance app for students."
publish_to: 'none'
version: 1.2.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.3
  path: ^1.9.0
  intl: ^0.19.0
  uuid: ^4.4.0
  cupertino_icons: ^1.0.8
  fl_chart: ^0.68.0
  flutter_local_notifications: ^17.2.0
  timezone: ^0.9.4
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.0.0
  crypto: ^3.0.3
  local_auth: ^2.1.8
  file_picker: ^8.0.0
  share_plus: ^9.0.0
  pdf: ^3.10.8
  printing: ^5.13.0
  csv: ^6.0.0
  url_launcher: ^6.3.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.18.0
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/app_icon.png
